<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ModSense</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=IBM+Plex+Mono:wght@400;500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #07080d;
    --surface: #0f1118;
    --surface-hi: #151823;
    --border: #1e2230;
    --border-hi: #2e3450;
    --orange: #ff6c2f;
    --orange-dim: #ff6c2f30;
    --blue: #4a7cff;
    --blue-dim: #4a7cff20;
    --green: #2ecc8a;
    --green-dim: #2ecc8a20;
    --red: #ff4560;
    --red-dim: #ff456020;
    --text: #e8eaf0;
    --muted: #747b8d;
    --quiet: #5a6070;
    --mono: 'IBM Plex Mono', monospace;
    --serif: 'DM Serif Display', Georgia, serif;
    --sans: 'DM Sans', sans-serif;
  }

  *, *::before, *::after {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    font-weight: 300;
    min-height: 100vh;
    overflow-x: hidden;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(var(--border) 1px, transparent 1px),
      linear-gradient(90deg, var(--border) 1px, transparent 1px);
    background-size: 48px 48px;
    opacity: 0.35;
    pointer-events: none;
    z-index: 0;
  }

  .wrap {
    position: relative;
    z-index: 1;
    max-width: 820px;
    margin: 0 auto;
    padding: 60px 24px 100px;
  }

  header {
    margin-bottom: 56px;
  }

  .eyebrow {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--orange);
    margin-bottom: 14px;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .eyebrow::before {
    content: '';
    display: block;
    width: 28px;
    height: 1px;
    background: var(--orange);
  }

  .sentiment-graph {
    width: 100%;
    height: auto;
    display: block;
    margin-top: 8px;
  }

  .grid-line {
    stroke: var(--border);
    stroke-width: 1;
  }
  
  .axis-line {
    stroke: var(--border-hi);
    stroke-width: 1.4;
  }
  
  .axis-label,
  .axis-title,
  .point-label,
  .threshold-label {
    font-family: var(--mono);
    fill: var(--muted);
    font-size: 11px;
  }

  .axis-title {
    font-size: 12px;
  }
  
  .sentiment-line {
    fill: none;
    stroke: var(--orange);
    stroke-width: 3;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  
  .graph-point {
    fill: var(--orange);
    stroke: var(--surface);
    stroke-width: 2;
  }

  .graph-point.low {
    fill: var(--quiet);
  }
  
  .point-label {
    fill: var(--text);
    font-size: 10px;
  }
  
  .threshold {
    stroke-width: 1.5;
    stroke-dasharray: 6 6;
    opacity: 0.55;
  }

  .positive-threshold {
    stroke: var(--green);
  }
  
  .negative-threshold {
    stroke: var(--red);
  }
  
  .threshold-label.positive {
    fill: var(--green);
  }
  
  .threshold-label.negative {
    fill: var(--red);
  }

  h1 {
    font-family: var(--serif);
    font-size: clamp(2.2rem, 6vw, 3.6rem);
    font-weight: 400;
    line-height: 1.1;
    color: var(--text);
  }

  h1 em {
    font-style: italic;
    color: var(--orange);
  }

  .sub {
    margin-top: 16px;
    font-size: 15px;
    color: var(--muted);
    max-width: 520px;
    line-height: 1.65;
  }

  #status-bar {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--muted);
    padding: 12px 18px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--surface);
    margin-bottom: 40px;
    display: flex;
    align-items: center;
    gap: 10px;
    transition: border-color 0.3s;
  }

  #status-bar.ready { border-color: var(--green); color: var(--green); }
  #status-bar.error { border-color: var(--red); color: var(--red); }
  #status-bar.loading { border-color: var(--orange); color: var(--orange); }

  .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: currentColor;
    flex-shrink: 0;
  }

  .dot.pulse {
    animation: pulse 1.4s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.4; transform: scale(0.8); }
  }

  .search-row {
    display: flex;
    gap: 12px;
    margin-bottom: 40px;
  }

  .search-row input {
    flex: 1;
    min-width: 0;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 16px 20px;
    font-family: var(--mono);
    font-size: 15px;
    color: var(--text);
    letter-spacing: 0.06em;
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
  }

  .search-row input::placeholder {
    color: var(--quiet);
  }

  .search-row input:focus {
    border-color: var(--orange);
    box-shadow: 0 0 0 3px var(--orange-dim);
  }

  .btn {
    padding: 16px 28px;
    border-radius: 8px;
    border: none;
    font-family: var(--sans);
    font-size: 14px;
    font-weight: 500;
    letter-spacing: 0.03em;
    cursor: pointer;
    transition: opacity 0.2s, transform 0.15s;
  }

  .btn:active {
    transform: scale(0.97);
  }

  .btn:disabled {
    opacity: 0.35;
    cursor: not-allowed;
  }

  .btn-primary {
    background: var(--orange);
    color: #fff;
  }

  .btn-primary:not(:disabled):hover {
    opacity: 0.88;
  }

  #autocomplete {
    position: relative;
    margin-top: -32px;
    margin-bottom: 32px;
  }

  #ac-list {
    background: var(--surface);
    border: 1px solid var(--border-hi);
    border-radius: 8px;
    overflow: hidden;
    display: none;
    max-height: 200px;
    overflow-y: auto;
  }

  .ac-item {
    padding: 10px 20px;
    font-family: var(--mono);
    font-size: 13px;
    cursor: pointer;
    color: var(--text);
    transition: background 0.15s;
  }

  .ac-item:hover {
    background: var(--border);
  }

  #compare-autocomplete {
    position: relative;
    margin-top: -12px;
    margin-bottom: 20px;
  }

  #compare-ac-list {
    background: var(--surface);
    border: 1px solid var(--border-hi);
    border-radius: 8px;
    overflow: hidden;
    display: none;
    max-height: 200px;
    overflow-y: auto;
  }

  #result {
    opacity: 0;
    transform: translateY(20px);
    transition: opacity 0.45s ease, transform 0.45s ease;
  }

  #result.visible {
    opacity: 1;
    transform: translateY(0);
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
  }

  .card-header {
    padding: 28px 32px 24px;
    border-bottom: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    flex-wrap: wrap;
    gap: 12px;
  }

  .module-code {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.15em;
    color: var(--muted);
    text-transform: uppercase;
    margin-bottom: 6px;
  }

  .module-title {
    font-family: var(--serif);
    font-size: 1.5rem;
    font-weight: 400;
    line-height: 1.2;
    max-width: 480px;
  }

  .review-count {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--muted);
    text-align: right;
    white-space: nowrap;
  }

  .review-count span {
    display: block;
    font-size: 22px;
    color: var(--text);
    font-weight: 500;
  }

  .score-section {
    padding: 32px;
    display: flex;
    gap: 32px;
    align-items: center;
    flex-wrap: wrap;
    border-bottom: 1px solid var(--border);
  }

  .score-big {
    display: flex;
    flex-direction: column;
    align-items: center;
    min-width: 100px;
  }

  .score-num {
    font-family: var(--serif);
    font-size: 5rem;
    line-height: 1;
    font-weight: 400;
  }

  .score-denom {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--muted);
    margin-top: 4px;
  }

  .sentiment-badge {
    display: inline-block;
    padding: 4px 14px;
    border-radius: 999px;
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    margin-top: 10px;
    font-weight: 500;
  }

  .sentiment-badge.positive { background: var(--green-dim); color: var(--green); }
  .sentiment-badge.neutral { background: var(--blue-dim); color: var(--blue); }
  .sentiment-badge.negative { background: var(--red-dim); color: var(--red); }

  .score-bar-wrap {
    flex: 1;
    min-width: 180px;
  }

  .score-bar-label,
  .dist-label,
  .timeline-label {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--muted);
    margin-bottom: 12px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }

  .score-track {
    height: 6px;
    background: var(--border);
    border-radius: 999px;
    overflow: hidden;
    margin-bottom: 8px;
  }

  .score-fill {
    height: 100%;
    border-radius: 999px;
    background: var(--orange);
    width: 0%;
    transition: width 1.2s cubic-bezier(0.16, 1, 0.3, 1);
  }

  .score-fill.positive { background: var(--green); }
  .score-fill.neutral { background: var(--blue); }
  .score-fill.negative { background: var(--red); }

  .score-ticks {
    display: flex;
    justify-content: space-between;
    font-family: var(--mono);
    font-size: 10px;
    color: var(--muted);
  }

  .dist-section,
  .timeline-section,
  .notice-section {
    padding: 28px 32px;
    border-bottom: 1px solid var(--border);
  }

  .notice-section {
    color: var(--orange);
    font-family: var(--mono);
    font-size: 13px;
    line-height: 1.6;
  }

  .notice-section strong {
    display: block;
    color: var(--text);
    font-family: var(--sans);
    font-size: 16px;
    font-weight: 500;
    margin-bottom: 6px;
  }

  .dist-row {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 12px;
  }

  .dist-name {
    font-family: var(--mono);
    font-size: 12px;
    width: 60px;
    flex-shrink: 0;
  }

  .dist-name.positive { color: var(--green); }
  .dist-name.neutral { color: var(--blue); }
  .dist-name.negative { color: var(--red); }

  .dist-track {
    flex: 1;
    height: 4px;
    background: var(--border);
    border-radius: 999px;
    overflow: hidden;
  }

  .dist-fill {
    height: 100%;
    border-radius: 999px;
    width: 0%;
    transition: width 1.4s cubic-bezier(0.16, 1, 0.3, 1);
  }

  .dist-fill.positive { background: var(--green); }
  .dist-fill.neutral { background: var(--blue); }
  .dist-fill.negative { background: var(--red); }

  .dist-count {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--muted);
    width: 32px;
    text-align: right;
    flex-shrink: 0;
  }

  .timeline-copy {
    color: var(--muted);
    font-size: 13px;
    line-height: 1.5;
    margin-bottom: 18px;
  }

  .timeline-chart {
    display: grid;
    gap: 12px;
  }

  .timeline-row {
    display: grid;
    grid-template-columns: minmax(118px, 170px) 1fr minmax(86px, auto);
    align-items: center;
    gap: 12px;
  }

  .timeline-period,
  .timeline-value,
  .timeline-count {
    font-family: var(--mono);
    font-size: 11px;
  }

  .timeline-period {
    color: var(--text);
    line-height: 1.35;
  }

  .timeline-value {
    color: var(--text);
    text-align: right;
  }

  .timeline-count {
    color: var(--muted);
    text-align: right;
  }

  .timeline-track {
    height: 18px;
    background: var(--border);
    border-radius: 999px;
    overflow: hidden;
  }

  .timeline-fill {
    height: 100%;
    min-width: 3px;
    border-radius: 999px;
    transition: width 1.2s cubic-bezier(0.16, 1, 0.3, 1);
  }

  .timeline-fill.positive { background: var(--green); }
  .timeline-fill.neutral { background: var(--blue); }
  .timeline-fill.negative { background: var(--red); }
  .timeline-fill.low { background: var(--quiet); }

  .timeline-axis {
    display: grid;
    grid-template-columns: minmax(118px, 170px) 1fr minmax(86px, auto);
    gap: 12px;
    margin-top: 8px;
  }

  .timeline-ticks {
    display: flex;
    justify-content: space-between;
    font-family: var(--mono);
    font-size: 10px;
    color: var(--muted);
  }

  .not-found {
    padding: 32px;
    font-family: var(--mono);
    font-size: 13px;
  }

  .not-found .nf-title {
    color: var(--red);
    margin-bottom: 12px;
  }

  .not-found .nf-sug {
    color: var(--muted);
    margin-bottom: 10px;
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  .sug-pills {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }

  .sug-pill {
    padding: 5px 12px;
    border: 1px solid var(--border-hi);
    border-radius: 6px;
    font-size: 12px;
    color: var(--text);
    cursor: pointer;
    transition: border-color 0.2s, color 0.2s;
  }

  .sug-pill:hover {
    border-color: var(--orange);
    color: var(--orange);
  }

  .error-card {
    border-color: var(--red);
    color: var(--red);
    padding: 24px 32px;
    font-family: var(--mono);
    font-size: 13px;
    line-height: 1.6;
  }

  .suggestion-section {
    padding: 24px 32px;
    border-bottom: 1px solid var(--border);
    background: var(--orange-dim);
  }

  .suggestion-label {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--orange);
    margin-bottom: 10px;
  }

  .suggestion-body {
    font-size: 14px;
    line-height: 1.6;
    color: var(--text);
  }

  .suggestion-body .sug-code {
    font-family: var(--mono);
    color: var(--orange);
    font-weight: 500;
    cursor: pointer;
    border-bottom: 1px dashed var(--orange);
  }

  .examples-section {
    padding: 28px 32px;
    border-bottom: 1px solid var(--border);
  }

  .examples-label {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 14px;
  }

  .example-item {
    font-size: 13px;
    line-height: 1.6;
    color: var(--text);
    padding: 14px 16px;
    background: var(--surface-hi);
    border: 1px solid var(--border);
    border-radius: 8px;
    margin-bottom: 10px;
  }

  .example-item:last-child {
    margin-bottom: 0;
  }

  .example-item::before {
    content: '\201C';
    color: var(--muted);
    font-family: var(--serif);
    margin-right: 2px;
  }

  .mode-tabs {
    display: flex;
    gap: 8px;
    margin-bottom: 16px;
  }

  .mode-tab {
    font-family: var(--mono);
    font-size: 12px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    padding: 9px 16px;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    transition: border-color 0.2s, color 0.2s;
  }

  .mode-tab.active {
    border-color: var(--orange);
    color: var(--orange);
  }

  #compare-panel {
    display: none;
  }

  .compare-hint {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--quiet);
    margin: -28px 0 20px;
  }

  .compare-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    gap: 16px;
  }

  .compare-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 24px;
  }

  .compare-card .module-code {
    margin-bottom: 4px;
  }

  .compare-card .module-title {
    font-size: 1.1rem;
    margin-bottom: 18px;
  }

  .compare-score {
    font-family: var(--serif);
    font-size: 2.6rem;
    line-height: 1;
    margin-bottom: 6px;
  }

  .compare-card .score-track {
    margin-top: 12px;
  }

  .compare-not-found {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--red);
  }

  footer {
    margin-top: 64px;
    padding-top: 24px;
    border-top: 1px solid var(--border);
    font-family: var(--mono);
    font-size: 11px;
    color: var(--muted);
    display: flex;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
  }

  .spinner {
    display: inline-block;
    width: 14px;
    height: 14px;
    border: 2px solid var(--border-hi);
    border-top-color: var(--orange);
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    flex-shrink: 0;
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  @media (max-width: 640px) {
    .wrap {
      padding: 40px 16px 72px;
    }

    .search-row {
      flex-direction: column;
    }

    .btn {
      width: 100%;
    }

    .card-header,
    .score-section,
    .dist-section,
    .timeline-section,
    .notice-section {
      padding: 24px 20px;
    }

    .review-count {
      text-align: left;
    }

    .timeline-row {
      grid-template-columns: 1fr;
      gap: 6px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
    }

    .timeline-value,
    .timeline-count {
      text-align: left;
    }

    .timeline-axis {
      display: none;
    }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="eyebrow">NUSMods / Disqus / Sentiment</div>
    <h1>Mod<em>Sense</em></h1>
    <p class="sub">Enter any NUS module code to see how students really feel, including sentiment movement by academic semester.</p>
  </header>

  <div id="status-bar" class="loading">
    <div class="dot pulse"></div>
    <span id="status-text">Initialising... loading model and fetching reviews.</span>
  </div>

  <div class="mode-tabs">
    <button class="mode-tab active" id="tab-single" onclick="setMode('single')">Single Module</button>
    <button class="mode-tab" id="tab-compare" onclick="setMode('compare')">Compare Modules</button>
  </div>

  <div id="single-panel">
    <div class="search-row">
      <input
        id="mod-input"
        type="text"
        placeholder="e.g. CS1101S"
        maxlength="10"
        autocomplete="off"
        spellcheck="false"
        disabled
      >
      <button class="btn btn-primary" id="analyze-btn" disabled onclick="analyze()">Analyse</button>
    </div>

    <div id="autocomplete">
      <div id="ac-list"></div>
    </div>

    <div id="result"></div>
  </div>

  <div id="compare-panel">
    <div class="search-row">
      <input
        id="compare-input"
        type="text"
        placeholder="e.g. CS1101S, MA1521, CS1010A"
        autocomplete="off"
        spellcheck="false"
        disabled
      >
      <button class="btn btn-primary" id="compare-btn" disabled onclick="compareModules()">Compare</button>
    </div>
    <div class="compare-hint">Separate two or more module codes with commas.</div>

    <div id="compare-autocomplete">
      <div id="compare-ac-list"></div>
    </div>

    <div id="compare-result"></div>
  </div>

  <footer>
    <span>ModSense</span>
    <span>Data from Disqus / HuggingFace model</span>
  </footer>
</div>

<script>
let allModules = [];
let statusInterval = null;

function pollStatus() {
  statusInterval = setInterval(async () => {
    try {
      const r = await fetch('/api/status');
      const d = await r.json();
      updateStatusBar(d);

      if (d.ready || d.error) {
        clearInterval(statusInterval);
        if (d.ready) {
          await loadModules();
          enableSearch();
        }
      }
    } catch (e) {
      updateStatusBar({ error: 'Server unreachable.' });
    }
  }, 2500);
}

function updateStatusBar(d) {
  const bar = document.getElementById('status-bar');
  const txt = document.getElementById('status-text');
  const dot = bar.querySelector('.dot');

  bar.className = '';
  dot.className = 'dot';

  if (d.error) {
    bar.classList.add('error');
    txt.textContent = 'ERROR: ' + d.error;
  } else if (d.ready) {
    bar.classList.add('ready');
    txt.textContent = 'READY: ' + d.progress;
  } else {
    bar.classList.add('loading');
    dot.classList.add('pulse');
    txt.textContent = d.progress || 'Loading...';
  }
}

async function loadModules() {
  const r = await fetch('/api/modules');
  const d = await r.json();
  if (d.modules) allModules = d.modules;
}

function enableSearch() {
  document.getElementById('mod-input').disabled = false;
  document.getElementById('analyze-btn').disabled = false;
  document.getElementById('mod-input').focus();
  document.getElementById('compare-input').disabled = false;
  document.getElementById('compare-btn').disabled = false;
}

function setMode(mode) {
  const single = mode === 'single';
  document.getElementById('single-panel').style.display = single ? 'block' : 'none';
  document.getElementById('compare-panel').style.display = single ? 'none' : 'block';
  document.getElementById('tab-single').classList.toggle('active', single);
  document.getElementById('tab-compare').classList.toggle('active', !single);
}

const input = document.getElementById('mod-input');
const acList = document.getElementById('ac-list');

input.addEventListener('input', () => {
  const q = input.value.toUpperCase().trim();
  if (!q || allModules.length === 0) {
    acList.style.display = 'none';
    return;
  }

  const hits = allModules.filter(m => m.startsWith(q)).slice(0, 8);
  if (!hits.length) {
    acList.style.display = 'none';
    return;
  }

  acList.innerHTML = hits.map(m =>
    `<div class="ac-item" onclick="pick('${m}')">${m}</div>`
  ).join('');
  acList.style.display = 'block';
});

input.addEventListener('keydown', e => {
  if (e.key === 'Enter') {
    acList.style.display = 'none';
    analyze();
  }
  if (e.key === 'Escape') acList.style.display = 'none';
});

document.addEventListener('click', e => {
  if (!document.getElementById('autocomplete').contains(e.target) && e.target !== input) {
    acList.style.display = 'none';
  }
});

function pick(code) {
  input.value = code;
  acList.style.display = 'none';
  analyze();
}

async function analyze() {
  const code = input.value.toUpperCase().trim();
  if (!code) return;

  acList.style.display = 'none';

  const btn = document.getElementById('analyze-btn');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>';

  const resultEl = document.getElementById('result');
  resultEl.classList.remove('visible');
  resultEl.innerHTML = '';

  try {
    const r = await fetch(`/api/analyze/${encodeURIComponent(code)}`);
    const d = await r.json();
    renderResult(d, r.ok);
  } catch (e) {
    renderError('Network error: ' + e.message);
  } finally {
    btn.disabled = false;
    btn.textContent = 'Analyse';
  }
}

function renderResult(d, ok) {
  const el = document.getElementById('result');

  if (d.error) {
    renderError(d.error);
    return;
  }

  if (!ok || !d.found) {
    const sugs = (d.suggestions || []).map(m =>
      `<span class="sug-pill" onclick="pick('${m}')">${m}</span>`
    ).join('');

    el.innerHTML = `<div class="card">
      <div class="not-found">
        <div class="nf-title">No reviews found for "${escHtml(d.module_code || '')}".</div>
        ${sugs ? `<div class="nf-sug">Similar modules</div><div class="sug-pills">${sugs}</div>` : ''}
      </div>
    </div>`;
    el.classList.add('visible');
    return;
  }

  const total = d.review_count;
  const dist = d.score_distribution || { positive: 0, neutral: 0, negative: 0 };
  const posP = total ? (dist.positive / total * 100).toFixed(0) : 0;
  const neuP = total ? (dist.neutral / total * 100).toFixed(0) : 0;
  const negP = total ? (dist.negative / total * 100).toFixed(0) : 0;
  const timeline = renderSemesterChart(d.semester_sentiment || []);

  if (!d.reliable) {
    el.innerHTML = `
      <div class="card">
        ${renderHeader(d)}
        <div class="notice-section">
          <strong>${escHtml(d.message || `Not enough reviews to analyse sentiment for ${d.module_code}`)}</strong>
          ${total} review${total === 1 ? '' : 's'} found; at least ${d.min_samples || 5} required.
        </div>
        ${timeline}
      </div>`;
    el.classList.add('visible');
    animateTimeline();
    return;
  }

  const pct = (d.score / 5) * 100;

  el.innerHTML = `
    <div class="card">
      ${renderHeader(d)}

      <div class="score-section">
        <div class="score-big">
          <div class="score-num" style="color: var(--${sentimentColor(d.sentiment)})">${Number(d.score).toFixed(2)}</div>
          <div class="score-denom">out of 5.00</div>
          <span class="sentiment-badge ${d.sentiment}">${d.sentiment}</span>
        </div>

        <div class="score-bar-wrap">
          <div class="score-bar-label">Sentiment Score</div>
          <div class="score-track">
            <div class="score-fill ${d.sentiment}" id="sf" style="width:0%"></div>
          </div>
          <div class="score-ticks">
            <span>0</span><span>1</span><span>2</span><span>3</span><span>4</span><span>5</span>
          </div>
        </div>
      </div>

      <div class="dist-section">
        <div class="dist-label">Review Breakdown</div>
        <div class="dist-row">
          <span class="dist-name positive">Positive</span>
          <div class="dist-track"><div class="dist-fill positive" id="dp" style="width:0%"></div></div>
          <span class="dist-count">${dist.positive}</span>
        </div>
        <div class="dist-row">
          <span class="dist-name neutral">Neutral</span>
          <div class="dist-track"><div class="dist-fill neutral" id="dn" style="width:0%"></div></div>
          <span class="dist-count">${dist.neutral}</span>
        </div>
        <div class="dist-row">
          <span class="dist-name negative">Negative</span>
          <div class="dist-track"><div class="dist-fill negative" id="dng" style="width:0%"></div></div>
          <span class="dist-count">${dist.negative}</span>
        </div>
      </div>

      ${renderSuggestion(d.suggestion)}
      ${renderExamples(d.examples)}

      ${timeline}
    </div>`;

  el.classList.add('visible');

  requestAnimationFrame(() => {
    setTimeout(() => {
      document.getElementById('sf').style.width = pct + '%';
      document.getElementById('dp').style.width = posP + '%';
      document.getElementById('dn').style.width = neuP + '%';
      document.getElementById('dng').style.width = negP + '%';
      animateTimeline();
    }, 80);
  });
}

function renderSuggestion(suggestion) {
  if (!suggestion) return '';

  const isPositive = suggestion.reason === 'positive';
  const verdict = isPositive
    ? `has a positive sentiment score of <strong>${Number(suggestion.score).toFixed(2)}/5</strong>`
    : `has the highest sentiment score of <strong>${Number(suggestion.score).toFixed(2)}/5</strong> among similar modules`;

  return `<div class="suggestion-section">
    <div class="suggestion-label">Suggested Alternative</div>
    <div class="suggestion-body">
      Consider <span class="sug-code" onclick="pick('${escHtml(suggestion.module_code)}')">${escHtml(suggestion.module_code)}</span> instead —
      it ${verdict} based on ${suggestion.review_count} review${suggestion.review_count === 1 ? '' : 's'}, from the same faculty and level.
    </div>
  </div>`;
}

function renderExamples(examples) {
  if (!examples || !examples.length) return '';

  const items = examples.map(ex => `<div class="example-item">${escHtml(ex)}</div>`).join('');

  return `<div class="examples-section">
    <div class="examples-label">Example Comments</div>
    ${items}
  </div>`;
}

function renderHeader(d) {
  return `
    <div class="card-header">
      <div>
        <div class="module-code">${escHtml(d.module_code)}</div>
        <div class="module-title">${escHtml(d.module_title)}</div>
      </div>
      <div class="review-count">
        <span>${d.review_count}</span>reviews analysed
      </div>
    </div>`;
}

function renderSemesterChart(points) {
  if (!points.length) {
    return `<div class="section">
      <div class="label">Semester Sentiment</div>
      <p class="timeline-copy">No dated reviews are available for the semester graph.</p>
    </div>`;
  }

  const width = 760;
  const height = 360;
  const padding = { top: 36, right: 28, bottom: 92, left: 56 };
  const chartW = width - padding.left - padding.right;
  const chartH = height - padding.top - padding.bottom;

  const yScale = score => padding.top + chartH - ((score / 5) * chartH);
  const xScale = i => {
    if (points.length === 1) return padding.left + chartW / 2;
    return padding.left + (i / (points.length - 1)) * chartW;
  };

  const coords = points.map((p, i) => ({
    x: xScale(i),
    y: yScale(Number(p.cumulative_average || 0)),
    score: Number(p.cumulative_average || 0),
    period: p.period,
    count: p.cumulative_review_count || 0,
    reliable: p.reliable
  }));

  const linePath = coords.map((p, i) =>
    `${i === 0 ? 'M' : 'L'} ${p.x} ${p.y}`
  ).join(' ');

  const xLabels = coords.map((p, i) => `
    <g transform="translate(${p.x}, ${height - padding.bottom + 24}) rotate(-42)">
      <text text-anchor="end" class="axis-label">${escHtml(p.period)}</text>
    </g>
  `).join('');

  const pointsSvg = coords.map(p => `
    <g>
      <circle
        cx="${p.x}"
        cy="${p.y}"
        r="${p.reliable ? 5 : 4}"
        class="${p.reliable ? 'graph-point' : 'graph-point low'}"
      ></circle>
      <text
        x="${p.x + 8}"
        y="${p.y - 8}"
        class="point-label"
      >${p.score.toFixed(2)} (${p.count})</text>
    </g>
  `).join('');

  const yTicks = [0, 1, 2, 3, 4, 5].map(v => {
    const y = yScale(v);
    return `
      <line x1="${padding.left}" y1="${y}" x2="${width - padding.right}" y2="${y}" class="grid-line"></line>
      <text x="${padding.left - 12}" y="${y + 4}" text-anchor="end" class="axis-label">${v}</text>
    `;
  }).join('');

  return `<div class="section">
    <div class="label">Semester Sentiment Over Time</div>
    <p class="timeline-copy">
      Line shows cumulative average sentiment at the end of each academic period. Grey points are below 5 cumulative reviews.
    </p>

    <svg class="sentiment-graph" viewBox="0 0 ${width} ${height}" role="img">
      ${yTicks}

      <line x1="${padding.left}" y1="${yScale(3.5)}" x2="${width - padding.right}" y2="${yScale(3.5)}" class="threshold positive-threshold"></line>
      <line x1="${padding.left}" y1="${yScale(2.5)}" x2="${width - padding.right}" y2="${yScale(2.5)}" class="threshold negative-threshold"></line>

      <text x="${width - padding.right}" y="${yScale(3.5) - 6}" text-anchor="end" class="threshold-label positive">Positive threshold</text>
      <text x="${width - padding.right}" y="${yScale(2.5) + 16}" text-anchor="end" class="threshold-label negative">Negative threshold</text>

      <line x1="${padding.left}" y1="${padding.top}" x2="${padding.left}" y2="${height - padding.bottom}" class="axis-line"></line>
      <line x1="${padding.left}" y1="${height - padding.bottom}" x2="${width - padding.right}" y2="${height - padding.bottom}" class="axis-line"></line>

      <path d="${linePath}" class="sentiment-line"></path>
      ${pointsSvg}
      ${xLabels}

      <text x="${padding.left - 42}" y="${padding.top + chartH / 2}" transform="rotate(-90 ${padding.left - 42} ${padding.top + chartH / 2})" text-anchor="middle" class="axis-title">
        Cumulative Average Sentiment
      </text>
    </svg>
  </div>`;
}

function animateTimeline() {
  
}
  
function sentimentColor(sentiment) {
  if (sentiment === 'positive') return 'green';
  if (sentiment === 'negative') return 'red';
  return 'blue';
}

function renderError(msg) {
  const el = document.getElementById('result');
  el.innerHTML = `<div class="card error-card">${escHtml(msg)}</div>`;
  el.classList.add('visible');
}

function escHtml(s) {
  return String(s)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#039;');
}

const compareInput = document.getElementById('compare-input');
const compareAcList = document.getElementById('compare-ac-list');

compareInput.addEventListener('input', () => {
  const raw = compareInput.value;
  const parts = raw.split(',');
  const current = parts[parts.length - 1].toUpperCase().trim();
  const already = parts.slice(0, -1).map(p => p.toUpperCase().trim());

  if (!current || allModules.length === 0) {
    compareAcList.style.display = 'none';
    return;
  }

  const hits = allModules
    .filter(m => m.startsWith(current) && !already.includes(m))
    .slice(0, 8);

  if (!hits.length) {
    compareAcList.style.display = 'none';
    return;
  }

  compareAcList.innerHTML = hits.map(m =>
    `<div class="ac-item" onclick="pickCompare('${m}')">${m}</div>`
  ).join('');
  compareAcList.style.display = 'block';
});

compareInput.addEventListener('keydown', e => {
  if (e.key === 'Enter') {
    compareAcList.style.display = 'none';
    compareModules();
  }
  if (e.key === 'Escape') compareAcList.style.display = 'none';
});

document.addEventListener('click', e => {
  if (!document.getElementById('compare-autocomplete').contains(e.target) && e.target !== compareInput) {
    compareAcList.style.display = 'none';
  }
});

function pickCompare(code) {
  const parts = compareInput.value.split(',');
  parts[parts.length - 1] = ' ' + code;
  compareInput.value = parts.map(p => p.trim()).join(', ') + ', ';
  compareAcList.style.display = 'none';
  compareInput.focus();
}

async function compareModules() {
  const raw = compareInput.value.trim();
  if (!raw) return;

  const codes = raw.split(',').map(c => c.trim()).filter(Boolean);
  if (codes.length < 2) {
    renderCompareError('Enter at least two module codes, separated by commas.');
    return;
  }

  const btn = document.getElementById('compare-btn');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>';

  const resultEl = document.getElementById('compare-result');
  resultEl.classList.remove('visible');
  resultEl.innerHTML = '';

  try {
    const r = await fetch(`/api/compare?modules=${encodeURIComponent(codes.join(','))}`);
    const d = await r.json();

    if (!r.ok || d.error) {
      renderCompareError(d.error || 'Something went wrong.');
      return;
    }

    renderCompare(d.modules || []);
  } catch (e) {
    renderCompareError('Network error: ' + e.message);
  } finally {
    btn.disabled = false;
    btn.textContent = 'Compare';
  }
}

function renderCompare(modules) {
  const el = document.getElementById('compare-result');

  const cards = modules.map(m => {
    if (!m.found) {
      return `<div class="compare-card">
        <div class="module-code">${escHtml(m.module_code)}</div>
        <div class="compare-not-found">No reviews found for this module.</div>
      </div>`;
    }

    if (!m.reliable) {
      return `<div class="compare-card">
        <div class="module-code">${escHtml(m.module_code)}</div>
        <div class="module-title">${escHtml(m.module_title)}</div>
        <div class="compare-not-found">Only ${m.review_count} review${m.review_count === 1 ? '' : 's'} found — not enough to score reliably.</div>
      </div>`;
    }

    const pct = (m.score / 5) * 100;

    return `<div class="compare-card">
      <div class="module-code">${escHtml(m.module_code)}</div>
      <div class="module-title">${escHtml(m.module_title)}</div>
      <div class="compare-score" style="color: var(--${sentimentColor(m.sentiment)})">${Number(m.score).toFixed(2)}</div>
      <span class="sentiment-badge ${m.sentiment}">${m.sentiment}</span>
      <div class="score-track">
        <div class="score-fill ${m.sentiment}" style="width:${pct}%"></div>
      </div>
      <div class="review-count" style="text-align:left; margin-top: 10px;">
        <span>${m.review_count}</span>reviews analysed
      </div>
    </div>`;
  }).join('');

  el.innerHTML = `<div class="compare-grid">${cards}</div>`;
  el.classList.add('visible');
}

function renderCompareError(msg) {
  const el = document.getElementById('compare-result');
  el.innerHTML = `<div class="card error-card">${escHtml(msg)}</div>`;
  el.classList.add('visible');
}

pollStatus();
</script>
